x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /app
  NEWS_DB_PATH: /app/storage/news.db
  VECTOR_DB_PATH: /app/storage/vector_db
  CHAT_MEMORY_DB_PATH: /app/storage/chat_memory/chat_memory.db
  SQLITE_WAL: "1"          # 本地用 /mnt/d 等挂载盘验证时改为 "0"

services:

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ai-news-backend:latest
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"   # 只绑本机，需要调试时用 SSH 隧道访问
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ai-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
          NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      expose:
        - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ai-network

  prefect-server:
    image: prefecthq/prefect:3.8.5-python3.11   # 与 requirements.txt 中的 prefect==3.8.5 保持一致
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ai-network

  prefect-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ai-news-backend:latest
    command: /bin/sh /app/docker/prefect/start-worker.sh
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      <<: *app-env
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ai-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - ai-network

volumes:
  prefect_data: