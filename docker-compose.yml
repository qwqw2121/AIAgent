services:

  # 1. 后端 (FastAPI + LangGraph Agent，MCP 作为子进程运行在同一容器内)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ${BGE_MODEL_HOST_PATH:-/mnt/d/AI_Models/bge-m3}:/app/models/bge-m3:ro
    env_file:
      - .env
    environment:
      BGE_MODEL_PATH: /app/models/bge-m3
      # LLM_API_KEY / LLM_BASE_URL / LLM_ROUTER / LLM_GENERATOR 从 .env 读取
      PYTHONUNBUFFERED: "1"   # 让 MCP 子进程的 print() 日志实时刷新到 stdout
    networks:
      - ai-network

  # 2. 前端 (Next.js)
  frontend:
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - ai-network

  # 3. Prefect Server (调度中心 UI)
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_UI_API_URL=http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - ai-network

  # 4. Prefect Worker (复用 backend 镜像，因为 daily_flow 依赖同一套代码/依赖)
  prefect-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: /bin/sh /app/docker/prefect/start-worker.sh
    volumes:
      - ./storage:/app/storage
      - ${BGE_MODEL_HOST_PATH:-/mnt/d/AI_Models/bge-m3}:/app/models/bge-m3:ro
      - ./docker/prefect/start-worker.sh:/app/docker/prefect/start-worker.sh:ro
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      BGE_MODEL_PATH: /app/models/bge-m3
    env_file:
      - .env
    depends_on:
      - prefect-server
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  prefect_data: